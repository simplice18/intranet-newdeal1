name: CI Pipeline - Branche Dev

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal

jobs:
  # ─────────────────────────────────────────
  # JOB 1 : Build de l'image Docker
  # ─────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire l'image Docker
        run: |
          docker build -t $IMAGE_NAME:dev-${{ github.sha }} .
          docker tag $IMAGE_NAME:dev-${{ github.sha }} $IMAGE_NAME:dev-latest

      - name: Sauvegarder l'image localement
        run: docker save $IMAGE_NAME:dev-latest -o image.tar

      - name: Uploader l'image comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  # ─────────────────────────────────────────
  # JOB 2 : Scan sécurité (Trivy + Gitleaks)
  # ─────────────────────────────────────────
  security-scan:
    name: Scan Sécurité
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Télécharger l'image Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Charger l'image Docker
        run: docker load -i image.tar

      - name: Scan des vulnérabilités avec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:dev-latest
          format: table
          exit-code: '0'          # En CI/dev on log sans bloquer
          severity: 'CRITICAL,HIGH'

      - name: Scan des secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────
  # JOB 3 : Push vers Docker Hub
  # ─────────────────────────────────────────
  push:
    name: Push Image Docker Hub
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Télécharger l'image Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Charger l'image Docker
        run: docker load -i image.tar

      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pousser l'image vers Docker Hub
        run: |
          docker push ${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:dev-latest