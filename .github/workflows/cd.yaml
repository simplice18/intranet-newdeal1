name: CD Pipeline - Branche Prod

on:
  push:
    branches: [ prod ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/intranet-newdeal

jobs:
  # ─────────────────────────────────────────
  # JOB 1 : Scan de sécurité avant déploiement
  # ─────────────────────────────────────────
  security-scan:
    name: Scan Sécurité Pre-Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Puller l'image de prod
        run: docker pull ${{ env.IMAGE_NAME }}:dev-latest

      - name: Scan Trivy (bloquant sur CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:dev-latest
          format: table
          exit-code: '1'          # Bloque si vulnérabilité trouvée
          severity: 'CRITICAL'

  # ─────────────────────────────────────────
  # JOB 2 : Déploiement sur runner_prod
  # ─────────────────────────────────────────
  deploy:
    name: Déploiement Production
    runs-on: runner_prod          # Runner self-hosted dédié prod
    needs: security-scan

    steps:
      - name: Se connecter à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Arrêter le conteneur existant
        run: docker stop intranet-newdeal || true && docker rm intranet-newdeal || true

      - name: Lancer le nouveau conteneur sur le port 80
        run: |
          docker run -d \
            --name intranet-newdeal \
            --restart always \
            -p 80:80 \
            ${{ env.IMAGE_NAME }}:dev-latest

      - name: Vérifier que le site répond
        run: curl -f http://localhost:80 || exit 1